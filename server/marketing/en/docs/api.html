<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zorven REST API — Documentation</title>
  <meta name="description" content="Zorven programmatic REST API reference: tunnels, clients, hostnames and analytics. Create a token, start with curl.">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; }
    .zbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; border-bottom: 1px solid rgba(128,128,128,.25);
      font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b0d10; color: #e8edf2;
    }
    .zbar a { color: inherit; text-decoration: none; opacity: .85; }
    .zbar a:hover { opacity: 1; }
    .zbar .spacer { flex: 1; }
    .zbar .muted { font-weight: 400; opacity: .6; font-size: 13px; }
    @media (prefers-color-scheme: light) {
      .zbar { background: #fff; color: #0b0d10; }
    }
  </style>
</head>
<body>
  <div class="zbar">
    <a href="/en/">Zorven</a>
    <span class="muted">REST API v1</span>
    <span class="spacer"></span>
    <a href="/docs/api">TR</a>
    <a href="/en/docs">Docs</a>
    <a href="https://panel.zorven.app">Panel</a>
  </div>

  <!-- Scalar API Reference: renders the embedded OpenAPI 3.1 spec (English) -->
  <script
    id="api-reference"
    data-url="/api/v1/openapi.en.yaml"
    data-configuration='{"theme":"default","layout":"modern","hideDownloadButton":false}'></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
