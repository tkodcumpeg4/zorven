openapi: 3.1.0
info:
  title: Zorven REST API
  version: "1.0.0"
  description: |
    Zorven's programmatic REST API. Manage your tunnels, clients, hostnames,
    policies, devices, team and IP rules; read request logs and your
    subscription/usage data. The same API is also reachable through MCP (Model
    Context Protocol) and OAuth 2.1.

    ## Authentication
    Two methods exist:

    1. **API token**: create a token from the **API Keys** section in the dashboard
       and send it in the `Authorization` header on every request:

    ```
    Authorization: Bearer zrv_api_xxxxxxxx...
    ```

    2. **OAuth 2.1 access token** (`at+jwt`): for MCP clients (Claude, ChatGPT, ...);
       see "OAuth 2.1 and MCP" below.

    API access is available on **Pro and above** plans.

    ## Scopes
    API tokens carry scopes (`resource:action`):
    `clients:read`, `clients:write`, `tunnels:read`, `tunnels:write`,
    `hostnames:read`, `hostnames:write`, `ip_allowlist:read`,
    `ip_allowlist:write`, `analytics:read`. A `write` scope also implies the
    `read` of the same resource. Insufficient scope → `403 insufficient_scope`.

    **Endpoints open to API tokens are limited by an allowlist.** Every endpoint
    not on the list is closed to tokens (default deny). Each endpoint below has a
    **Scope / access** note: "open to API tokens" or "Dashboard session or OAuth
    `full` scope".

    ## Pagination
    List endpoints accept `?limit=` (default 50, max 200) and `?cursor=`. The
    response body is a plain array; continuation is returned in headers:
    `X-Next-Cursor`, `X-Has-More` and the RFC5988 `Link: <...>; rel="next"`.
    If neither limit nor cursor is given, the full list is returned.

    ## Errors
    All errors share one shape:
    ```json
    { "error": { "code": "insufficient_scope", "message": "..." } }
    ```

    ## Rate limiting
    Programmatic requests are limited to ~30 requests/sec (burst 60) per tenant.
    Responses carry `X-RateLimit-Limit` and `X-RateLimit-Remaining`; on exceed,
    `429 rate_limited` + `Retry-After`.

    ## Project selection
    In multi-project organizations the `X-Zorven-Project: <project-id>` header
    selects the project a request applies to (`project_id` in the MCP `call_api` tool).

    ## OAuth 2.1 and MCP
    Zorven is an OAuth 2.1 authorization server and an MCP resource server.
    These endpoints are not under `/api/v1`; they live at `https://<host>/oauth/*`,
    `/.well-known/*` and `/mcp` (the relevant paths carry their own `servers`).

    - **Flow**: `authorization_code` + **PKCE S256 (mandatory)**. The client id is
      obtained through **dynamic client registration** (RFC 7591,
      `POST /oauth/register`, public clients only: `token_endpoint_auth_method=none`).
    - **Resource indicator** (RFC 8707): the management resource is
      `https://<host>/mcp`; the `resource` parameter must carry that value.
    - **Metadata**: `/.well-known/oauth-authorization-server`,
      `/.well-known/oauth-protected-resource`, JWKS at `/.well-known/jwks.json`.
    - **Endpoints**: `/oauth/authorize`, `/oauth/token`, `/oauth/revoke`, `/oauth/register`.
    - **Token lifetimes**: access token (`at+jwt`) **1 hour**; the refresh token
      is **rotating** (reuse revokes the whole family) and lasts **30 days**.
    - **MCP endpoint**: `POST/GET https://<host>/mcp` (streamable HTTP),
      `Authorization: Bearer <API token or OAuth access token>`. A 401 carries
      `WWW-Authenticate: Bearer resource_metadata="..."`.

    ### OAuth scopes
    | Scope | Meaning |
    |---|---|
    | `mcp:read` | All `*:read` scopes and `analytics:read` (read-only) |
    | `mcp:manage` | `mcp:read` + `clients:write`, `tunnels:write`, `hostnames:write` |
    | `clients:read` / `clients:write` | Clients |
    | `tunnels:read` / `tunnels:write` | Tunnels |
    | `tunnels:delete` | Delete tunnels (destructive; off by default on the consent screen) |
    | `hostnames:read` / `hostnames:write` | Hostnames |
    | `hostnames:delete` | Delete hostnames (destructive; off by default) |
    | `analytics:read` | Logs, metrics, subscription, audit |
    | `mcp` | Tunnel MCP resources only (grants nothing on the management API) |
    | `full` | **Full access**: the same authority as the user's dashboard session (see below) |

    ## Full access (`full` scope)
    `full` gives an MCP client **the same authority as the user's dashboard
    session**: the tenant role (owner/admin/member), plan gates and `X-Zorven-Project` project selection all apply.
    It exceeds the API-token allowlist but **never exceeds the user's own
    authority**; platform-admin endpoints work only if the user is really a platform admin.

    - **Consent screen**: a separate warning section, **off by default**. It is
      granted if the user ticks it even when the client did not ask; if the
      client asks, it is only suggested.
    - **Step-up**: the dashboard session must have been opened **within the last
      5 minutes** (with 2FA if password and 2FA are enabled). Otherwise
      `403 reauth_required`; the dashboard sends the user to sign in again and
      returns to the same consent page afterwards.
    - **Lifetimes**: `full` access token **30 minutes**, refresh token **7 days**
      (sliding). A grant older than 30 days cannot be refreshed (re-consent needed).
    - **Revocation**: **Connected apps** in the dashboard shows a "Full access"
      badge with one-click revoke.
    - **Audit**: every call is recorded as `mcp.full_call` (method + path, no body);
      terminal/screen tickets as `mcp.full_ticket`.
    - **Excluded endpoints** (`403 full_scope_excluded`): `/api/v1/api-tokens*`,
      `/api/v1/tokens*`, `/api/v1/team/members/{id}/tokens*`,
      `/api/v1/mail/app-passwords*`,
      `/api/v1/tunnels/{id}/mcp/keys*`, `POST /api/v1/device/approve`,
      `/api/v1/auth/*`, `DELETE /api/v1/organization`. OAuth app/grant management
      (`/oauth/*`) is unreachable from MCP; `call_api` only calls `/api/v1`.
      Account credentials (password/2FA/email) live under `/api/auth` and are out of MCP scope.

    ### MCP tools (with `full`)
    - `list_api_endpoints`: method/path/summary/required fields from OpenAPI
      (`filter`, `method`, `limit`, `offset`).
    - `call_api`: `method` (GET/POST/PUT/PATCH/DELETE), `path` (`/api/v1/...`),
      `query`, `body`, `project_id`, `confirm`. **DELETE** and destructive verbs
      (`revoke`, `revoke-sessions`, `rotate`, `freeze`, `send`) require
      `confirm=true`. Responses are capped at 256 KB (`truncated: true` when cut).
      WebSocket/streaming endpoints (`/events`, `/clients/{id}/terminal|screen`) cannot be called.
    - Existing tools also work with `full` (including delete tools; they still ask for `confirm`).

    Detailed guide: `docs/mcp.md`.
  contact:
    name: Zorven
    url: https://zorven.app
    email: sales@zorven.app

servers:
  - url: https://zorven.app/api/v1
    description: Production

security:
  - bearerAuth: []
  - oauth2: [mcp:read]

tags:
  - name: Meta
    description: Health, identity and plan info
  - name: Clients
    description: Agent machines that open tunnels
  - name: Tunnels
    description: hostname → client → local target mappings
  - name: Hostnames
    description: Names a tunnel is published under
  - name: IP Allowlist
    description: CIDR-based access rules
  - name: Analytics
    description: Request logs, subscription and usage

  - name: Projects
    description: "Projects and organization"
  - name: Policies
    description: "Policy engine and resource access policies"
  - name: Devices
    description: "Device inventory"
  - name: Network
    description: "Private network (Zorven Net / WireGuard) and private resources"
  - name: Secrets
    description: "Secret Vault"
  - name: Tokens
    description: "API tokens"
  - name: Team
    description: "Team members and invitations"
  - name: Mail
    description: "Webmail"
  - name: Captcha
    description: "Zorven CAPTCHA: widget, verification service and site management"
  - name: Billing
    description: "Subscription"
  - name: "Platform admin"
    description: "Platform admins only"
  - name: "OAuth & MCP"
    description: "OAuth 2.1 authorization server and MCP endpoint (not under /api/v1)"

paths:
  /health:
    get:
      tags: [Meta]
      summary: Service health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  connected_clients: { type: integer }

  /me:
    get:
      tags: [Meta]
      summary: Current identity and tenant
      responses:
        "200":
          description: OK
        "401": { $ref: "#/components/responses/Unauthorized" }

  /plans:
    get:
      tags: [Meta]
      summary: Available plans
      security: []
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }

  /clients:
    get:
      tags: [Clients]
      summary: List clients
      description: "Scope: `clients:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Client list
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Clients]
      summary: Create client
      description: "Scope: `clients:write`. The response returns a token shown only once."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "home-pc" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/Client" }
                  token:
                    type: string
                    description: Client token — shown ONLY here, store it.
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /clients/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Clients]
      summary: Get client
      description: "Scope: `clients:read`"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clients]
      summary: Delete client
      description: "Scope: `clients:write`. The live connection is dropped and its tunnels are removed."
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{id}/token:
    post:
      tags: [Clients]
      summary: Rotate client token
      description: "Scope: `clients:write`. The old token is invalidated."
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels:
    get:
      tags: [Tunnels]
      summary: List tunnels
      description: "Scope: `tunnels:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Tunnel list
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tunnels]
      summary: Create tunnel
      description: "Scope: `tunnels:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_id, target]
              properties:
                name: { type: string, description: "Short name (single DNS label)", example: "api" }
                client_id: { type: string, example: "cli_a1b2c3" }
                target: { type: string, example: "http://localhost:8000" }
                hostname_id: { type: string, description: "Optionally bind to an existing hostname" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tunnels/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Tunnels]
      summary: Get tunnel
      description: "Scope: `tunnels:read`"
      responses:
        "200":
          description: Tunnel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tunnels]
      summary: Update tunnel
      description: "Scope: `tunnels:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, example: "http://localhost:9000" }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tunnels]
      summary: Delete tunnel
      description: "Scope: `tunnels:write`"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hostnames:
    get:
      tags: [Hostnames]
      summary: List hostnames
      description: "Scope: `hostnames:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Hostname list
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Hostnames]
      summary: Create platform hostname
      description: |
        Scope: `hostnames:write`. Allocates a name under the platform domain.

        **`kind` defaults to `scoped`** (tenant name): `<name>--<tenant-slug>.<platform>`,
        exclusively yours. **`kind: short`** allocates a global short name
        (`<name>.<platform>`, first come first served); there is no per-tenant limit
        in this edition. Names cannot contain
        `zorven` or `rpshell` (`409 name_reserved`); reserved short names are also
        `409 name_reserved`, taken names `409 hostname_taken`, and labels containing
        consecutive hyphens (`--`) return `422 invalid_name`.

        **Backward compatibility:** clients that omit `kind` used to receive a short
        name; they now receive a tenant name. Existing short names keep working.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "api" }
                kind:
                  type: string
                  enum: [scoped, short]
                  default: scoped
                  description: "scoped: name--tenant.platform (default); short: name.platform (first come first served)"
                tunnel_id: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /hostnames/custom:
    post:
      tags: [Hostnames]
      summary: Attach a custom (customer) domain
      description: "Scope: `hostnames:write`. Returns DNS verification instructions."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fqdn]
              properties:
                fqdn: { type: string, example: "api.customer.com" }
                tunnel_id: { type: string }
      responses:
        "201":
          description: Created (pending verification)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Hostname"
                  - type: object
                    properties:
                      instructions:
                        type: object
                        description: DNS verification instructions
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /hostnames/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [Hostnames]
      summary: Update hostname (bind/unbind tunnel)
      description: "Scope: `hostnames:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnel_id: { type: [string, "null"] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Hostnames]
      summary: Delete hostname
      description: "Scope: `hostnames:write`"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hostnames/{id}/verify:
    post:
      tags: [Hostnames]
      summary: Trigger custom domain DNS verification
      description: "Scope: `hostnames:write`"
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ip-allowlist:
    get:
      tags: [IP Allowlist]
      summary: List IP rules
      description: "Scope: `ip_allowlist:read`"
      responses:
        "200":
          description: Rule list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IP Allowlist]
      summary: Create IP rule
      description: "Scope: `ip_allowlist:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr: { type: string, example: "203.0.113.0/24" }
                tunnel_id: { type: [string, "null"] }
                description: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /ip-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [IP Allowlist]
      summary: Update IP rule
      description: "Scope: `ip_allowlist:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cidr: { type: string }
                description: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [IP Allowlist]
      summary: Delete IP rule
      description: "Scope: `ip_allowlist:write`"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests:
    get:
      tags: [Analytics]
      summary: Query request logs
      description: "Scope: `analytics:read`"
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer } }
        - { name: tunnel_id, in: query, schema: { type: string } }
        - { name: hostname, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "'404' or a '2xx' class" }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Log list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequestLog" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tunnels/{id}/access-events:
    get:
      tags: [Analytics]
      summary: Tunnel visitor sign-in events
      description: "Scope: `analytics:read`. Basic/OAuth sign-in attempts (passwords are never stored). Newest first; cursor pagination (`X-Next-Cursor`, `X-Has-More`)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels/{id}/access-events/summary:
    get:
      tags: [Analytics]
      summary: Tunnel visitor sign-in summary
      description: "Scope: `analytics:read`. Success/failure counts, by method and provider; unique identities and IPs."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, enum: ["24h", "7d", "30d"], default: "24h" } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessEventSummary" }
        "400": { description: Invalid window }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels/{id}/mcp:
    get:
      tags: [Analytics]
      summary: Tunnel MCP mode setting
      description: "Scope: `tunnels:read`. Returns the MCP settings (auth, tool allow/deny lists, limits) and the connection URLs."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: MCP setting }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Analytics]
      summary: Configure MCP mode
      description: "Scope: `tunnels:write` (owner/admin). HTTP tunnels only. `auth`: oauth (default) | apikey | none (needs `ack_no_auth`). `allow_tools`/`deny_tools` take `*`/`?` globs; deny wins; an unparseable body is rejected in policy mode. Not changeable: the raw API keys (panel only)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                config:
                  type: object
                  properties:
                    path: { type: string, default: /mcp }
                    transport: { type: string, enum: [streamable, sse, auto] }
                    auth: { type: string, enum: [oauth, apikey, none] }
                    ack_no_auth: { type: boolean }
                    allow_tools: { type: array, items: { type: string } }
                    deny_tools: { type: array, items: { type: string } }
                    log_level: { type: string, enum: [meta, none] }
                    max_request_bytes: { type: integer }
                    head_timeout_sec: { type: integer, maximum: 900 }
                    idle_timeout_sec: { type: integer, maximum: 3600 }
                    rate_limit_per_min: { type: integer, maximum: 6000 }
                    max_streams: { type: integer, maximum: 200 }
                    allow_org_members: { type: boolean }
                    allowed_emails: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "invalid_config / not_http / oauth_unavailable" }

  /tunnels/{id}/mcp/calls:
    get:
      tags: [Analytics]
      summary: MCP call log
      description: "Scope: `analytics:read`. Metadata only (method, tool, status, duration); arguments and results are never stored."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ok, error, denied, rate_limited] } }
        - { name: window, in: query, schema: { type: string, enum: ["1h", "24h", "7d", "30d"] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: "Calls, newest first" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels/{id}/mcp/stats:
    get:
      tags: [Analytics]
      summary: MCP tool analytics
      description: "Scope: `analytics:read`. Per-tool calls, errors, denied, average/p95/max latency."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, enum: ["1h", "24h", "7d", "30d"], default: "24h" } }
      responses:
        "200": { description: Statistics }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels/{id}/door:
    get:
      tags: [Analytics]
      summary: Web door setting (TCP/UDP)
      description: "Scope: `tunnels:read`. Raw TCP/UDP tunnels only. Returns the door URL and the connection address."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Door setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelDoor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Tunnel is not TCP/UDP" }
    put:
      tags: [Analytics]
      summary: Configure the web door
      description: "Scope: `tunnels:write`. Enabling requires a configured sign-in method (basic/oauth) on the tunnel. Duration: 3600, 43200 (default), 86400 or 604800 seconds."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                duration_sec: { type: integer, enum: [3600, 43200, 86400, 604800], default: 43200 }
      responses:
        "200":
          description: Door setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelDoor" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Tunnel is not TCP/UDP" }
        "422": { description: "invalid_duration / access_not_configured" }

