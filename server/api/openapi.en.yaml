  /.well-known/oauth-authorization-server:
    servers:
      - url: https://zorven.app
    get:
      tags: ["OAuth & MCP"]
      summary: "OAuth authorization server metadata (RFC 8414)"
      description: "`grant_types_supported`: authorization_code, refresh_token; `code_challenge_methods_supported`: S256; `token_endpoint_auth_methods_supported`: none; `scopes_supported`: the scope list (including `full`); `resource_indicators_supported`: true. No authentication."
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthServerMetadata" } } } }

  /.well-known/oauth-protected-resource:
    servers:
      - url: https://zorven.app
    get:
      tags: ["OAuth & MCP"]
      summary: "Protected resource metadata (RFC 9728)"
      description: "Advertises the management resource `https://<host>/mcp` and its authorization server. The `WWW-Authenticate` header of the MCP endpoint's 401 points here."
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /.well-known/jwks.json:
    servers:
      - url: https://zorven.app
    get:
      tags: ["OAuth & MCP"]
      summary: "Access-token signing keys (JWKS)"
      description: "Public key set for verifying `at+jwt` access-token signatures."
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /oauth/register:
    servers:
      - url: https://zorven.app
    post:
      tags: ["OAuth & MCP"]
      summary: "Dynamic client registration (RFC 7591)"
      description: "Public clients only (`token_endpoint_auth_method=none`). PKCE S256 is mandatory. The returned `client_id` is used in the authorization flow."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: { type: string }
                redirect_uris: { type: array, items: { type: string } }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                response_types: { type: array, items: { type: string, enum: [code] } }
                token_endpoint_auth_method: { type: string, enum: [none] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { client_id: { type: string }, client_name: { type: string }, redirect_uris: { type: array, items: { type: string } } } } } } }
        "400": { description: invalid_client_metadata / invalid_redirect_uri }

  /oauth/authorize:
    servers:
      - url: https://zorven.app
    get:
      tags: ["OAuth & MCP"]
      summary: "Authorization request (authorization_code + PKCE)"
      description: "A browser redirect: sends the user to the dashboard consent page and, after consent, returns to `redirect_uri` with `code`, `state` and `iss`. `code_challenge_method=S256` is mandatory. If `full` is requested in `scope`, or the user ticks it on the consent screen, step-up applies: when the dashboard session was not opened in the last 5 minutes the result is `403 reauth_required` and a re-login."
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string, example: "mcp:read tunnels:write" } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string, example: "https://zorven.app/mcp" } }
      responses:
        "302": { description: Redirect }
        "400": { description: invalid_request / invalid_scope }

  /oauth/token:
    servers:
      - url: https://zorven.app
    post:
      tags: ["OAuth & MCP"]
      summary: "Token endpoint"
      description: "Accepts `authorization_code` (code + `code_verifier`) or `refresh_token`. The access token is `at+jwt`, 1 hour (30 minutes for `full`). The refresh token rotates; reuse revokes the family; 30 days (7 days sliding for `full`, and refresh is refused once the grant is older than 30 days)."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string }
                refresh_token: { type: string }
                resource: { type: string, example: "https://zorven.app/mcp" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthTokenResponse" } } } }
        "400": { description: "invalid_request / invalid_grant / invalid_scope" }

  /oauth/revoke:
    servers:
      - url: https://zorven.app
    post:
      tags: ["OAuth & MCP"]
      summary: "Token revocation (RFC 7009)"
      description: "Revokes a refresh token (and its grant)."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [token], properties: { token: { type: string }, client_id: { type: string } } }
      responses:
        "200": { description: OK }

  /mcp:
    servers:
      - url: https://zorven.app
    post:
      tags: ["OAuth & MCP"]
      summary: "MCP request (JSON-RPC, streamable HTTP)"
      description: "The management MCP endpoint. `Authorization: Bearer` with an API token (`zrv_api_...`) or an OAuth access token. A 401 carries `WWW-Authenticate: Bearer resource_metadata=\"...\"`. A token with the `full` scope unlocks the `list_api_endpoints` and `call_api` tools; `call_api` only calls `/api/v1` endpoints, requires `confirm=true` for DELETE and destructive verbs, caps responses at 256 KB and returns `403 full_scope_excluded` on excluded endpoints."
      security:
        - bearerAuth: []
        - oauth2: [mcp:read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: JSON-RPC 2.0 }
      responses:
        "200": { description: OK }
        "401": { description: "Unauthorized (WWW-Authenticate: Bearer resource_metadata=...)" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: ["OAuth & MCP"]
      summary: "MCP stream (SSE, streamable HTTP)"
      description: "The management MCP endpoint. `Authorization: Bearer` with an API token (`zrv_api_...`) or an OAuth access token. A 401 carries `WWW-Authenticate: Bearer resource_metadata=\"...\"`. A token with the `full` scope unlocks the `list_api_endpoints` and `call_api` tools; `call_api` only calls `/api/v1` endpoints, requires `confirm=true` for DELETE and destructive verbs, caps responses at 256 KB and returns `403 full_scope_excluded` on excluded endpoints."
      security:
        - bearerAuth: []
        - oauth2: [mcp:read]
      responses:
        "200": { description: OK }
        "401": { description: "Unauthorized (WWW-Authenticate: Bearer resource_metadata=...)" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zrv_api_...
      description: "API token created in the dashboard. `Authorization: Bearer zrv_api_...`"
    oauth2:
      type: oauth2
      description: "OAuth 2.1 (authorization_code + PKCE S256). For the /mcp endpoint and /api/v1 with an OAuth access token."
      flows:
        authorizationCode:
          authorizationUrl: https://zorven.app/oauth/authorize
          tokenUrl: https://zorven.app/oauth/token
          refreshUrl: https://zorven.app/oauth/token
          scopes:
            mcp:read: "Read-only"
            mcp:manage: "Read + management writes"
            clients:read: Clients (read)
            clients:write: Clients (write)
            tunnels:read: Tunnels (read)
            tunnels:write: Tunnels (write)
            tunnels:delete: "Delete tunnels (destructive)"
            hostnames:read: Hostnames (read)
            hostnames:write: Hostnames (write)
            hostnames:delete: "Delete hostnames (destructive)"
            analytics:read: Analytics (read)
            mcp: "Tunnel MCP resources only"
            full: "Full access: same authority as the dashboard session (step-up required)"

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 50, maximum: 200 }
      description: Page size (opt-in pagination)
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: The X-Next-Cursor value from the previous response

  headers:
    XNextCursor:
      description: Next page cursor (if any)
      schema: { type: string }
    XHasMore:
      description: Whether more records exist
      schema: { type: boolean }

  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient scope, plan limit or no access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (e.g. hostname already taken)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CaptchaTotals:
      type: object
      properties:
        challenge: { type: integer }
        solve: { type: integer }
        verify_ok: { type: integer }
        verify_fail: { type: integer }
        renewals: { type: integer }
        unique_passes: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: insufficient_scope }
            message: { type: string }
      required: [error]

    Client:
      type: object
      properties:
        id: { type: string, example: "cli_a1b2c3" }
        name: { type: string, example: "home-pc" }
        status: { type: string, enum: [online, offline] }
        version: { type: string }
        remote_addr: { type: string }
        is_service: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }

    Tunnel:
      type: object
      properties:
        id: { type: string, example: "tun_x9y8z7" }
        client_id: { type: string, example: "cli_a1b2c3" }
        target: { type: string, example: "http://localhost:8000" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        hostnames:
          type: array
          items: { $ref: "#/components/schemas/Hostname" }

    Hostname:
      type: object
      properties:
        id: { type: string, example: "hn_abc123" }
        tunnel_id: { type: string }
        fqdn: { type: string, example: "api.zorven.app" }
        type: { type: string, enum: [global, scoped, legacy, custom], description: "global = short name, scoped = tenant name" }
        verified: { type: boolean }
        suspended_reason: { type: string, enum: [plan_limit], description: "When set, the name is suspended by a plan limit (access closed, not deleted)" }
        suspended_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    IPRule:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        tunnel_id: { type: [string, "null"] }
        cidr: { type: string, example: "203.0.113.0/24" }
        description: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccessEvent:
      type: object
      properties:
        id: { type: string }
        tunnel_id: { type: string }
        hostname: { type: string }
        method: { type: string, enum: [basic, oauth] }
        provider: { type: string }
        identity: { type: string }
        success: { type: boolean }
        reason: { type: string, description: "ok, bad_credentials, email_not_allowed, rate_limited, provider_not_configured" }
        client_ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    AccessEventSummary:
      type: object
      properties:
        window: { type: string }
        since: { type: string, format: date-time }
        total: { type: integer }
        success: { type: integer }
        failure: { type: integer }
        by_method: { type: object, additionalProperties: { type: integer } }
        by_provider: { type: object, additionalProperties: { type: integer } }
        by_reason: { type: object, additionalProperties: { type: integer } }
        unique_identities: { type: integer }
        unique_ips: { type: integer }
        door_grants: { type: integer, description: "Web door: number of doors opened and of connections/flows rejected without a grant (aggregated per minute/IP). Not included in `total/success/failure`." }
        door_blocked: { type: integer }
        door_blocked_ips: { type: integer }
    TunnelDoor:
      type: object
      properties:
        tunnel_id: { type: string }
        enabled: { type: boolean }
        duration_sec: { type: integer }
        durations: { type: array, items: { type: integer } }
        available: { type: boolean }
        host: { type: string, example: "door--ssh--acme.zorven.app" }
        url: { type: string, example: "https://door--ssh--acme.zorven.app/" }
        connect_address: { type: string, example: "zorven.app:10005" }
        proto: { type: string }
        exposure: { type: string }
        access_mode: { type: string }
        access_ready: { type: boolean }
    DoorGrant:
      type: object
      properties:
        id: { type: string }
        tunnel_id: { type: string }
        ip: { type: string }
        identity: { type: string }
        method: { type: string, enum: [basic, oauth] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    RequestLog:
      type: object
      properties:
        id: { type: string, example: "req_00f1" }
        tunnel_id: { type: string }
        ts: { type: string, format: date-time }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        duration_ms: { type: integer }

    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price_monthly: { type: integer, description: "USD cents" }
        max_clients: { type: [integer, "null"], description: "null = unlimited" }
        max_tunnels: { type: [integer, "null"] }
        max_custom_domains: { type: [integer, "null"] }
        bandwidth_limit_bytes: { type: [integer, "null"] }
        bandwidth_normal_mbps: { type: integer }
        bandwidth_throttled_mbps: { type: integer }
        max_members: { type: [integer, "null"] }
        has_api_access: { type: boolean }
        has_ip_allowlist: { type: boolean }

    Subscription:
      type: object
      properties:
        tenant_id: { type: string }
        plan: { type: string, example: "pro" }
        status: { type: string, example: "active" }
        current_period_end: { type: [string, "null"], format: date-time }
        bandwidth_limit_bytes: { type: integer }
        trial_used: { type: boolean }
        extra_devices: { type: integer, description: "Team extra devices (effective on Team only)" }
        extra_gb: { type: integer, description: "Team extra monthly GB" }
        effective_max_clients: { type: [integer, "null"], description: "Client limit including extra devices; null = unlimited" }
        effective_bandwidth_limit_bytes: { type: [integer, "null"], description: "Monthly traffic limit including extra GB; null = unlimited" }
        created_at: { type: string, format: date-time }
        plan_details: { $ref: "#/components/schemas/Plan" }

    Ok:
      type: object
      properties:
        ok: { type: boolean }

    Project:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }

    PolicyBinding:
      type: object
      properties:
        policy_id: { type: string }
        tunnel_id: { type: string }
        hostname: { type: string }

    Policy:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        priority: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/PolicyBinding" }

    Device:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          properties:
            tunnels:
              type: array
              items: { $ref: "#/components/schemas/Tunnel" }
            tags: { type: object, additionalProperties: { type: string } }

    Secret:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        key_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        token_id: { type: string }
        token_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    TeamMember:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string }
        tokens_count: { type: integer }
        email_sent: { type: boolean }
        created_at: { type: string, format: date-time }

    MailMessage:
      type: object
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        from: { type: string }
        to: { type: string }
        subject: { type: string }
        text_body: { type: string }
        html_body: { type: string }
        message_id: { type: string }
        in_reply_to: { type: string }
        seen: { type: boolean }
        received_at: { type: string, format: date-time }

    TunnelAlert:
      type: object
      properties:
        tunnel_id: { type: string }
        enabled: { type: boolean }
        error_rate_pct: { type: integer }
        window_min: { type: integer }
        min_requests: { type: integer }
        notify_email: { type: string }
        state: { type: string, enum: [ok, firing] }
        last_changed_at: { type: [string, "null"], format: date-time }
        last_notified_at: { type: [string, "null"], format: date-time }

    TunnelSecurity:
      type: object
      properties:
        tunnel_id: { type: string }
        config: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
        bot:
          type: object
          description: "Bot protection (proof-of-work check). mode=always and rate limiting require Pro+; on lower plans always -> suspicious and rate is not enforced (settings are kept)."
          properties:
            mode: { type: string, enum: [off, suspicious, always] }
            difficulty: { type: integer, minimum: 12, maximum: 22, default: 18, description: "PoW bit count (12-22, default 18)" }
            ttl_minutes: { type: integer, minimum: 5, maximum: 10080, default: 60, description: "Verification cookie lifetime in minutes (5-10080, default 60)" }
            exclude_paths: { type: array, maxItems: 32, items: { type: string }, description: "Excluded paths (max 32, `*` only at the end)" }
            allow_verified_bots: { type: boolean, default: true, description: "Verified search-engine bots pass (default true)" }
            block_empty_ua: { type: boolean, default: false, description: "Block requests with an empty User-Agent (default false)" }
        rate:
          type: object
          description: "Rate limit (per tunnel+IP, per window). Pro+."
          properties:
            enabled: { type: boolean }
            requests: { type: integer, minimum: 1, maximum: 100000, default: 120, description: "Requests per window (1-100000, default 120)" }
            window_seconds: { type: integer, minimum: 1, maximum: 3600, default: 60, description: "Window length in seconds (1-3600, default 60)" }
            action: { type: string, enum: [block, challenge], default: block, description: "Action when exceeded (default block)" }
            exclude_paths: { type: array, maxItems: 32, items: { type: string }, description: "Excluded paths (max 32, `*` only at the end)" }

    PathRoute:
      type: object
      properties:
        id: { type: string }
        fqdn: { type: string }
        path_prefix: { type: string }
        tunnel_id: { type: string }
        created_at: { type: string, format: date-time }

    Grantee:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, group, device] }
        id: { type: string }

    NetShare:
      type: object
      properties:
        id: { type: string }
        owner_client_id: { type: string }
        name: { type: string }
        proto: { type: string }
        port: { type: integer }
        grantees: { type: array, items: { $ref: "#/components/schemas/Grantee" } }
        expires_at: { type: [string, "null"], format: date-time }
        ephemeral: { type: boolean }
        created_at: { type: string, format: date-time }

    TunRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        src: { $ref: "#/components/schemas/Grantee" }
        dst: { type: string }
        proto: { type: string }
        ports: { type: string }
        src_name: { type: string }
        dst_name: { type: string }

    OAuthServerMetadata:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        revocation_endpoint: { type: string }
        jwks_uri: { type: string }
        response_types_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        resource_indicators_supported: { type: boolean }

    OAuthTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: "3600; 1800 for the full scope" }
        refresh_token: { type: string }
        scope: { type: string }
