  /captcha/platform-config:
    get:
      tags: [Captcha]
      summary: "Whether the platform CAPTCHA site is enabled (used for Zorven signup)"
      description: "No authentication (widget endpoints are rate-limited per IP)."
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { enabled: { type: boolean }, sitekey: { type: string } } }

  /captcha/challenge:
    post:
      tags: [Captcha]
      summary: "Widget: request a PoW challenge"
      description: "Called by the widget (`/captcha/v1/api.js`). CORS: the Origin is checked against the site domain list (not allowed: 403 `origin_not_allowed`). `signals` is optional; automation hints raise the difficulty. No authentication (widget endpoints are rate-limited per IP)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sitekey], properties: { sitekey: { type: string }, signals: { type: object, additionalProperties: true } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string }, nonce: { type: string }, difficulty: { type: integer }, expires_at: { type: string, format: date-time } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: "rate_limited" }

  /captcha/solve:
    post:
      tags: [Captcha]
      summary: "Widget: submit the PoW solution"
      description: "On a valid solution returns a signed, SINGLE-USE response token valid for 300 s, bound to the site and hostname. If the site has `pass_cookie` enabled, `pass` (the pass cookie value) is returned too. Automation signals: 403 `automated`. No authentication (widget endpoints are rate-limited per IP)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, counter], properties: { token: { type: string }, counter: { type: string, description: "SHA-256(nonce || decimal counter) leading-zero-bits" }, signals: { type: object, additionalProperties: true } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { response: { type: string }, expires_at: { type: string, format: date-time }, pass: { type: string }, pass_ttl_seconds: { type: integer } } }
        "400": { description: "invalid_token | expired | already_used | invalid_solution" }
        "403": { description: "origin_not_allowed | origin_mismatch | automated" }
        "429": { description: "rate_limited" }

  /captcha/renew:
    post:
      tags: [Captcha]
      summary: "Widget: get a response with a pass cookie, no PoW"
      description: "Exchanges a valid `zcap_pass` (signature + site + expiry) for a new single-use response. No IP binding. No authentication (widget endpoints are rate-limited per IP)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sitekey, pass], properties: { sitekey: { type: string }, pass: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { response: { type: string }, expires_at: { type: string, format: date-time } } }
        "400": { description: "invalid_token | expired" }
        "403": { description: "origin_not_allowed" }
        "429": { description: "rate_limited" }

  /captcha/siteverify:
    post:
      tags: [Captcha]
      summary: "Verify a response token (siteverify)"
      description: "Turnstile compatible. The body may be a form (`application/x-www-form-urlencoded`) or JSON. A failed verification also returns HTTP 200 with `success:false`. Error codes: missing-input-secret, invalid-input-secret, missing-input-response, invalid-input-response, timeout-or-duplicate, internal-error. Server-to-server; no session, authorized by `secret`."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [secret, response], properties: { secret: { type: string }, response: { type: string }, remoteip: { type: string } } }
          application/json:
            schema: { type: object, required: [secret, response], properties: { secret: { type: string }, response: { type: string }, remoteip: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, challenge_ts: { type: string, format: date-time }, hostname: { type: string }, "error-codes": { type: array, items: { type: string } } } }

