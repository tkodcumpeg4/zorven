      description: "Widget `/captcha/v1/api.js` tarafından çağrılır. CORS: Origin, sitenin alan listesine göre denetlenir (izinsiz: 403 `origin_not_allowed`). `signals` isteğe bağlıdır; otomasyon belirtileri zorluğu artırır. Kimlik gerektirmez (widget uçları IP başına hız sınırlıdır)."
