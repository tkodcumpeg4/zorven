  /captcha/solve:
    post:
      tags: [Captcha]
      summary: "Widget: PoW çözümünü gönder"
      description: "Çözüm doğruysa imzalı, TEK kullanımlık, 300 sn geçerli, site + hostname bağlı yanıt jetonu döner. Sitede `pass_cookie` açıksa `pass` (geçiş çerezi değeri) da döner. Otomasyon belirtileri: 403 `automated`. Kimlik gerektirmez (widget uçları IP başına hız sınırlıdır)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, counter], properties: { token: { type: string }, counter: { type: string, description: "SHA-256(nonce || decimal counter) leading-zero-bits" }, signals: { type: object, additionalProperties: true } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { response: { type: string }, expires_at: { type: string, format: date-time }, pass: { type: string }, pass_ttl_seconds: { type: integer } } }
        "400": { description: "invalid_token | expired | already_used | invalid_solution" }
        "403": { description: "origin_not_allowed | origin_mismatch | automated" }
        "429": { description: "rate_limited" }

  /captcha/renew:
    post:
      tags: [Captcha]
      summary: "Widget: geçiş çerezi ile PoW'suz yanıt al"
      description: "Geçerli `zcap_pass` (imza + site + süre) karşılığında yeni tek kullanımlık yanıt verir. IP bağı yoktur. Kimlik gerektirmez (widget uçları IP başına hız sınırlıdır)."
