        "403": { description: "origin_not_allowed" }
        "429": { description: "rate_limited" }

  /captcha/siteverify:
    post:
      tags: [Captcha]
      summary: "Yanıt jetonunu doğrula (siteverify)"
      description: "Turnstile uyumludur. Gövde form (`application/x-www-form-urlencoded`) ya da JSON olabilir. Başarısız doğrulama da HTTP 200 + `success:false` döner. Hata kodları: missing-input-secret, invalid-input-secret, missing-input-response, invalid-input-response, timeout-or-duplicate, internal-error. Sunucudan sunucuya; kimlik gerektirmez, `secret` ile yetkilenir."
