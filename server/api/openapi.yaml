openapi: 3.1.0
info:
  title: Zorven REST API
  version: "1.0.0"
  description: |
    Zorven'in programatik REST API'si. Tünellerinizi, istemcilerinizi,
    hostname'lerinizi, politikalarınızı, cihazlarınızı, ekibinizi ve IP kurallarınızı
    yönetmenizi; istek loglarını ve abonelik/kullanım verinizi okumanızı sağlar.
    Aynı API'ye MCP (Model Context Protocol) ve OAuth 2.1 ile de erişilebilir.

    ## Kimlik doğrulama
    İki yöntem vardır:

    1. **API token**: Panelde **API Anahtarları** bölümünden bir token oluşturun ve
       her istekte `Authorization` başlığında gönderin:

    ```
    Authorization: Bearer zrv_api_xxxxxxxx...
    ```

    2. **OAuth 2.1 erişim token'ı** (`at+jwt`): MCP istemcileri (Claude, ChatGPT vb.)
       için; bkz. aşağıdaki "OAuth 2.1 ve MCP" bölümü.

    API erişimi **Pro ve üzeri** planlarda kullanılabilir.

    ## Kapsamlar (scopes)
    API token'ları `kaynak:aksiyon` biçiminde kapsam taşır:
    `clients:read`, `clients:write`, `tunnels:read`, `tunnels:write`,
    `hostnames:read`, `hostnames:write`, `ip_allowlist:read`,
    `ip_allowlist:write`, `analytics:read`. `write`, aynı kaynağın `read`'ini
    de kapsar. Yetersiz kapsam → `403 insufficient_scope`.

    **API token'a açık uçlar bir izin listesiyle (allowlist) sınırlıdır.** Listede
    olmayan her uç token'a kapalıdır (varsayılan ret). Bu belgede her ucun
    açıklamasında **Kapsam / erişim** notu vardır: "API token'a açık" ya da
    "Panel oturumu veya OAuth `full` kapsamı".

    ## Sayfalama
    Liste uçları `?limit=` (varsayılan 50, maks 200) ve `?cursor=` kabul eder.
    Yanıt gövdesi düz bir dizidir; devam bilgisi başlıklarda döner:
    `X-Next-Cursor`, `X-Has-More` ve RFC5988 `Link: <...>; rel="next"`.
    limit/cursor verilmezse tüm liste döner.

    ## Hatalar
    Tüm hatalar ortak biçimdedir:
    ```json
    { "error": { "code": "insufficient_scope", "message": "..." } }
    ```

    ## Hız sınırı
    Programatik istekler kiracı başına ~30 istek/sn (burst 60) ile sınırlıdır.
    Yanıtlarda `X-RateLimit-Limit` ve `X-RateLimit-Remaining` döner; aşımda
    `429 rate_limited` + `Retry-After`.

    ## Proje seçimi
    Çok projeli organizasyonlarda `X-Zorven-Project: <proje-id>` başlığı isteğin
    hangi projeye uygulanacağını seçer (MCP `call_api` aracında `project_id`).

    ## OAuth 2.1 ve MCP
    Zorven bir OAuth 2.1 yetkilendirme sunucusu ve bir MCP kaynak sunucusudur.
    Bu uçlar `/api/v1` altında değildir; `https://<alan>/oauth/*`,
    `/.well-known/*` ve `/mcp` adreslerindedir (ilgili yollarda ayrı `servers` verilmiştir).

    - **Akış**: `authorization_code` + **PKCE S256 (zorunlu)**. İstemci kimliği
      **dinamik istemci kaydı** ile alınır (RFC 7591, `POST /oauth/register`,
      yalnızca kamusal istemci: `token_endpoint_auth_method=none`).
    - **Resource indicator** (RFC 8707): yönetim kaynağı `https://<alan>/mcp`
      adresidir; `resource` parametresi bu değeri taşımalıdır.
    - **Meta veri**: `/.well-known/oauth-authorization-server`,
      `/.well-known/oauth-protected-resource`, JWKS `/.well-known/jwks.json`.
    - **Uçlar**: `/oauth/authorize`, `/oauth/token`, `/oauth/revoke`, `/oauth/register`.
    - **Token ömürleri**: access token (`at+jwt`) **1 saat**; refresh token
      **döner** (yeniden kullanım algılanırsa tüm aile iptal edilir) ve **30 gün** geçerlidir.
    - **MCP uç noktası**: `POST/GET https://<alan>/mcp` (streamable HTTP),
      `Authorization: Bearer <API token veya OAuth access token>`. 401 yanıtı
      `WWW-Authenticate: Bearer resource_metadata="..."` başlığını taşır.

    ### OAuth kapsamları
    | Kapsam | Anlamı |
    |---|---|
    | `mcp:read` | Tüm `*:read` kapsamları ve `analytics:read` (salt okuma) |
    | `mcp:manage` | `mcp:read` + `clients:write`, `tunnels:write`, `hostnames:write` |
    | `clients:read` / `clients:write` | İstemciler |
    | `tunnels:read` / `tunnels:write` | Tüneller |
    | `tunnels:delete` | Tünel silme (yıkıcı; onay ekranında varsayılan kapalı) |
    | `hostnames:read` / `hostnames:write` | Hostname'ler |
    | `hostnames:delete` | Hostname silme (yıkıcı; varsayılan kapalı) |
    | `analytics:read` | Loglar, metrikler, abonelik, denetim |
    | `mcp` | Yalnızca tünel MCP kaynakları (yönetim API'sine yetki vermez) |
    | `full` | **Tam erişim**: kullanıcının panel oturumuyla aynı yetki (aşağıya bakın) |

    ## Tam erişim (`full` kapsamı)
    `full`, MCP istemcisine kullanıcının **panel oturumuyla aynı yetkiyi** verir:
    kiracı rolü (owner/admin/member), plan
    kapıları ve `X-Zorven-Project` proje seçimi aynen uygulanır. API token
    izin listesini aşar ama **kullanıcının kendi yetkisini asla aşmaz**; platform
    yönetici uçları yalnızca kullanıcı gerçekten platform yöneticisiyse çalışır.

    - **Onay ekranı**: ayrı bir uyarı bölümünde, varsayılan **kapalı**. İstemci
      istemese bile kullanıcı işaretlerse verilir; istemci isterse yalnızca önerilir.
    - **Step-up (yeniden doğrulama)**: onay için panel oturumu **son 5 dakikada**
      açılmış olmalıdır (parola ve 2FA açıksa 2FA ile giriş). Aksi halde
      `403 reauth_required`; panel kullanıcıyı yeniden girişe yönlendirir ve
      girişten sonra aynı onay sayfasına döner.
    - **Ömürler**: `full` access token **30 dakika**, refresh token **7 gün**
      (kayan). Grant 30 günden eskiyse yenileme reddedilir (yeniden onay gerekir).
    - **İptal**: panelde **Bağlı uygulamalar** bölümünde "Tam erişim" rozeti ve tek tıkla iptal.
    - **Denetim**: her çağrı `mcp.full_call` olarak kaydedilir (method + path, gövde yok);
      terminal/ekran biletleri `mcp.full_ticket`.
    - **Hariç uçlar** (`403 full_scope_excluded`): `/api/v1/api-tokens*`,
      `/api/v1/tokens*`, `/api/v1/team/members/{id}/tokens*`,
      `/api/v1/mail/app-passwords*`,
      `/api/v1/tunnels/{id}/mcp/keys*`, `POST /api/v1/device/approve`,
      `/api/v1/auth/*`, `DELETE /api/v1/organization`. OAuth uygulama/grant
      yönetimi (`/oauth/*`) MCP'den erişilemez; `call_api` yalnızca `/api/v1` çağırır.
      Hesap kimlik bilgileri (parola/2FA/e-posta) `/api/auth` altındadır ve MCP kapsamı dışındadır.

    ### MCP araçları (`full` ile)
    - `list_api_endpoints`: OpenAPI'den method/path/özet/gerekli alanlar
      (`filter`, `method`, `limit`, `offset`).
    - `call_api`: `method` (GET/POST/PUT/PATCH/DELETE), `path` (`/api/v1/...`),
      `query`, `body`, `project_id`, `confirm`. **DELETE** ve yıkıcı fiiller
      (`revoke`, `revoke-sessions`, `rotate`, `freeze`, `send`) için `confirm=true`
      zorunludur. Yanıt 256 KB ile sınırlıdır (kesilirse `truncated: true`).
      WebSocket/akış uçları (`/events`, `/clients/{id}/terminal|screen`) çağrılamaz.
    - Mevcut araçlar `full` ile de çalışır (silme araçları dahil; onlar da `confirm` ister).

    Ayrıntılı kılavuz: `docs/mcp.md`.
  contact:
    name: Zorven
    url: https://zorven.app
    email: sales@zorven.app

servers:
  - url: https://zorven.app/api/v1
    description: Üretim

security:
  - bearerAuth: []
  - oauth2: [mcp:read]

tags:
  - name: Meta
    description: Sağlık, kimlik ve plan bilgisi
  - name: Clients
    description: Tünel açan ajan makineler
  - name: Tunnels
    description: hostname → istemci → yerel hedef eşleştirmeleri
  - name: Hostnames
    description: Bir tünelin yayınlandığı adlar
  - name: IP Allowlist
    description: CIDR bazlı erişim kuralları
  - name: Analytics
    description: İstek logları, abonelik ve kullanım

  - name: Projects
    description: "Projeler ve organizasyon"
  - name: Policies
    description: "Politika motoru ve kaynak erişim politikaları"
  - name: Devices
    description: "Cihaz envanteri"
  - name: Network
    description: "Özel ağ (Zorven Net / WireGuard) ve özel kaynaklar"
  - name: Secrets
    description: "Secret Vault"
  - name: Tokens
    description: "API token'ları"
  - name: Team
    description: "Ekip üyeleri ve davetler"
  - name: Mail
    description: "Webmail"
  - name: Captcha
    description: "Zorven CAPTCHA: widget, doğrulama servisi ve site yönetimi"
  - name: Billing
    description: "Abonelik"
  - name: "Platform admin"
    description: "Yalnızca platform yöneticileri"
  - name: "OAuth & MCP"
    description: "OAuth 2.1 yetkilendirme sunucusu ve MCP uç noktası (/api/v1 altında değildir)"

paths:
  /health:
    get:
      tags: [Meta]
      summary: Servis sağlığı
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  connected_clients: { type: integer }

  /me:
    get:
      tags: [Meta]
      summary: Geçerli kimlik ve kiracı
      responses:
        "200":
          description: OK
        "401": { $ref: "#/components/responses/Unauthorized" }

  /plans:
    get:
      tags: [Meta]
      summary: Kullanılabilir planlar
      security: []
      responses:
        "200":
          description: Plan listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }

  /clients:
    get:
      tags: [Clients]
      summary: İstemcileri listele
      description: "Kapsam: `clients:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: İstemci listesi
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Clients]
      summary: İstemci oluştur
      description: "Kapsam: `clients:write`. Yanıtta bir kez gösterilen token döner."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "ev-pc" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/Client" }
                  token:
                    type: string
                    description: İstemci token'ı — SADECE burada gösterilir, saklayın.
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /clients/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Clients]
      summary: İstemci getir
      description: "Kapsam: `clients:read`"
      responses:
        "200":
          description: İstemci
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Clients]
      summary: İstemci sil
      description: "Kapsam: `clients:write`. Canlı bağlantı koparılır, tünelleri silinir."
      responses:
        "204": { description: Silindi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{id}/token:
    post:
      tags: [Clients]
      summary: İstemci token'ını yenile
      description: "Kapsam: `clients:write`. Eski token geçersiz olur."
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Yeni token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tunnels:
    get:
      tags: [Tunnels]
      summary: Tünelleri listele
      description: "Kapsam: `tunnels:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Tünel listesi
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tunnels]
      summary: Tünel oluştur
      description: "Kapsam: `tunnels:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_id, target]
              properties:
                name: { type: string, description: "Kısa ad (tek DNS etiketi)", example: "api" }
                client_id: { type: string, example: "cli_a1b2c3" }
                target: { type: string, example: "http://localhost:8000" }
                hostname_id: { type: string, description: "Opsiyonel mevcut hostname'e bağla" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tunnels/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Tunnels]
      summary: Tünel getir
      description: "Kapsam: `tunnels:read`"
      responses:
        "200":
          description: Tünel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tunnels]
      summary: Tünel güncelle
      description: "Kapsam: `tunnels:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, example: "http://localhost:9000" }
                enabled: { type: boolean }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tunnels]
      summary: Tünel sil
      description: "Kapsam: `tunnels:write`"
      responses:
        "204": { description: Silindi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hostnames:
    get:
      tags: [Hostnames]
      summary: Hostname'leri listele
      description: "Kapsam: `hostnames:read`"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Hostname listesi
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
            X-Has-More: { $ref: "#/components/headers/XHasMore" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Hostnames]
      summary: Platform hostname'i oluştur
      description: |
        Kapsam: `hostnames:write`. Platform domaini altında ad verir.

        **`kind` varsayılanı `scoped`'dur** (kiracı adı): `<ad>--<kiracı-slug>.<platform>`,
        yalnızca sizde. **`kind: short`** global kısa ad verir
        (`<ad>.<platform>`, ilk gelen alır); bu sürümde kiracı başına sınır yoktur. Ad `zorven` veya `rpshell` içeremez (`409 name_reserved`);
        ayrılmış kısa adlar da `409 name_reserved`, alınmış adlar `409 hostname_taken`,
        ardışık tire (`--`) içeren etiket `422 invalid_name` döner.

        **Geriye dönük uyumluluk:** `kind` göndermeyen istemciler eskiden kısa ad
        alırdı; artık kiracı adı alırlar. Mevcut kısa adlar aynen çalışır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "api" }
                kind:
                  type: string
                  enum: [scoped, short]
                  default: scoped
                  description: "scoped: ad--kiracı.platform (varsayılan); short: ad.platform (ilk gelen alır)"
                tunnel_id: { type: string }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /hostnames/custom:
    post:
      tags: [Hostnames]
      summary: Özel (müşteri) domain bağla
      description: "Kapsam: `hostnames:write`. DNS doğrulama talimatları döner."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fqdn]
              properties:
                fqdn: { type: string, example: "api.musteri.com" }
                tunnel_id: { type: string }
      responses:
        "201":
          description: Oluşturuldu (doğrulama bekliyor)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Hostname"
                  - type: object
                    properties:
                      instructions:
                        type: object
                        description: DNS doğrulama talimatları
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /hostnames/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [Hostnames]
      summary: Hostname güncelle (tünel bağla/çöz)
      description: "Kapsam: `hostnames:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnel_id: { type: [string, "null"] }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Hostnames]
      summary: Hostname sil
      description: "Kapsam: `hostnames:write`"
      responses:
        "204": { description: Silindi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hostnames/{id}/verify:
    post:
      tags: [Hostnames]
      summary: Özel domain DNS doğrulamasını tetikle
      description: "Kapsam: `hostnames:write`"
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Doğrulama sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hostname" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ip-allowlist:
    get:
      tags: [IP Allowlist]
      summary: IP kurallarını listele
      description: "Kapsam: `ip_allowlist:read`"
      responses:
        "200":
          description: Kural listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IP Allowlist]
      summary: IP kuralı oluştur
      description: "Kapsam: `ip_allowlist:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr: { type: string, example: "203.0.113.0/24" }
                tunnel_id: { type: [string, "null"] }
                description: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /ip-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [IP Allowlist]
      summary: IP kuralı güncelle
      description: "Kapsam: `ip_allowlist:write`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cidr: { type: string }
                description: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IPRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [IP Allowlist]
      summary: IP kuralı sil
      description: "Kapsam: `ip_allowlist:write`"
      responses:
        "204": { description: Silindi }
