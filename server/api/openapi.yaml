  /tunnels/{id}/mcp:
    get:
      tags: [Analytics]
      summary: Tunel MCP modu ayari
      description: "Kapsam: `tunnels:read`. MCP ayarlarini (kimlik dogrulama, arac izin/ret listeleri, sinirlar) ve baglanti URL'lerini doner."
