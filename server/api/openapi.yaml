        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: MCP setting }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Analytics]
      summary: MCP modunu ayarla
      description: "Kapsam: `tunnels:write` (sahip/yonetici). Yalniz HTTP tunelleri. `auth`: oauth (varsayilan) | apikey | none (`ack_no_auth` gerekir). `allow_tools`/`deny_tools` `*`/`?` joker kabul eder; ret onceliklidir; politika modunda ayristirilamayan govde reddedilir. API anahtarlari yalniz panelden yonetilir."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                config:
                  type: object
                  properties:
                    path: { type: string, default: /mcp }
                    transport: { type: string, enum: [streamable, sse, auto] }
                    auth: { type: string, enum: [oauth, apikey, none] }
                    ack_no_auth: { type: boolean }
                    allow_tools: { type: array, items: { type: string } }
                    deny_tools: { type: array, items: { type: string } }
                    log_level: { type: string, enum: [meta, none] }
                    max_request_bytes: { type: integer }
                    head_timeout_sec: { type: integer, maximum: 900 }
                    idle_timeout_sec: { type: integer, maximum: 3600 }
                    rate_limit_per_min: { type: integer, maximum: 6000 }
                    max_streams: { type: integer, maximum: 200 }
                    allow_org_members: { type: boolean }
                    allowed_emails: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "invalid_config / not_http / oauth_unavailable" }

