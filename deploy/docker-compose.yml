# Konteyner log siniri (Y9): json-file surucusu varsayilan olarak dosyayi SINIRSIZ
# buyutur; log seli (tarayici el sikismalari, IP reddi) diski doldurabilirdi. Servis
# basina en fazla 5 x 20 MB. Tek tanim, tum servislerde `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # O20: setuid ikililerle yetki kazanimi kapali. Yetenekler DUSURULMEZ: giris betigi
    # root'tan gosu ile postgres kullanicisina gecer ve veri dizinini chown eder.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpshell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli (deploy/.env)}
      POSTGRES_DB: ${POSTGRES_DB:-rpshell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Yalnizca sunucunun kendisinden erisilebilir; internete ACILMAZ.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpshell} -d ${POSTGRES_DB:-rpshell}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zorven-primary:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # USER gecisi: imaj varsayilani 65532 (root degil). Bu dosya gecis tamamlanana kadar
    # root'u ACIKCA korur; root olmayan + salt okunur kip icin bu dosyanin USTUNE
    # deploy/docker-compose.nonroot.yml eklenir (deploy/ops/migrate-nonroot.sh). Geri alma:
    # override'siz `docker compose up -d zorven-primary`.
    user: "0:0"
    # O20 konteyner sertlestirme (root kipte).
    # Sunucu ham soket, TUN, chown, setuid KULLANMAZ (kod taramasi); gereken tek yetenek
    # 80/443/25/587/465/993'e baglanmak (NET_BIND_SERVICE). DAC_OVERRIDE + FOWNER gecis
    # suresince tutulur: bind mount'lardaki (or. ./certs) dosyalar baska
    # bir uid'e ait ve 0600 olabilir; root bunlari yalniz bu yeteneklerle okuyabilir.
    # Dusenler: NET_RAW, MKNOD, SETUID/SETGID, SYS_CHROOT, KILL, SETFCAP, SETPCAP, FSETID, AUDIT_WRITE, CHOWN.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - FOWNER
    # Bellek (O7): GOMEMLIMIT cop toplayiciya yumusak tavan verir (patlamadan sonra
    # bellek hizla geri verilir); mem_limit sert tavandir ve GOMEMLIMIT'in USTUNDE
    # olmali (aksi halde GC devreye girmeden OOM). Varsayilanlar ~3 GB'lik tek makine
    # icindir; ikisi de .env ile degistirilebilir.
    mem_limit: ${ZORVEN_MEM_LIMIT:-2g}
    # Y6: SIGTERM'de sunucu yoldaki istekleri 10 sn'ye kadar bekler, sonra son log
    # yazimlarini (<=12 sn) bitirip havuzu kapatir. Docker varsayilani 10 sn sonra SIGKILL
    # gonderir ve bu sirayi keserdi.
    stop_grace_period: 30s
    # Saglik (canlilik): statik /api/v1/health. DB'ye BAKMAZ: kisa bir Postgres
    # kesintisinde konteyner "unhealthy" olup yeniden baslatilmasin (veri yolu DB'siz
    # calismaya devam eder). Hazir olma (DB dahil) icin /readyz dis izlemede kullanilir:
    # curl -fsk https://<host>/readyz  (DB erisilemezken ve kapanista 503).
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "--max-time", "4", "https://127.0.0.1:443/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      # 8443 geriye dönük uyumluluk için container'ın 443'üne yönlendirilir
      # (eski CLI dokümanları :8443 kullanır).
      - "8443:443"
      # Webmail inbound SMTP: mail.<domain> MX buraya gelen mailleri teslim eder.
      # NOT: sunucu firewall'unda ve hosting sağlayıcıda inbound 25 açık olmalı.
      - "25:25"
      # Mail istemcisi erisimi (Gmail uygulamasi, Outlook, Apple Mail, Thunderbird):
      # 993 = IMAP (implicit TLS), 587 = SMTP gonderim (STARTTLS zorunlu),
      # 465 = SMTP gonderim (implicit TLS). Konteynerin KENDI 587'si; ayri `mail`
      # (Postfix) servisinin ic 587'si ile cakismaz. Sunucu firewall'unda ve hosting
      # saglayicida bu portlar acik olmali (saglayicilar giden/gelen 587/465'i
      # kisitlayabilir). Kapatmak icin ZORVEN_IMAP_ADDR / ZORVEN_SUBMISSION_ADDR /
      # ZORVEN_SUBMISSIONS_ADDR = off.
      - "993:993"
      - "587:587"
      - "465:465"
      # Ham TCP/UDP rezerve-port tünelleri (FAZ 3 / D2, Mod A). Bu aralıktan her
      # tünele bir port atanır (<alan-adi>:PORT). Firewall'da da açık olmalı.
      # Iki IP'li kurulum (K3 Faz 5): birincil aralik TCP_BIND_IP1'e, ikinci IP'nin
      # 10000-10099'u kapsayicinin 20000-20099'una baglanir (ZORVEN_TCP_BIND_IPS'teki
      # +10000 kaydirmasi). Tek IP'de varsayilanlar bugunku davranisi korur.
      - "${TCP_BIND_IP1:-0.0.0.0}:10000-10099:10000-10099"
      - "${TCP_BIND_IP1:-0.0.0.0}:10000-10099:10000-10099/udp"
      - "${TCP_BIND_IP2:-127.0.0.1}:10000-10099:20000-20099"
      - "${TCP_BIND_IP2:-127.0.0.1}:10000-10099:20000-20099/udp"
      # Zorven Net W2: STUN (istemciler arasi dogrudan P2P icin NAT adres
      # yansimasi; ZORVEN_STUN_ADDR, vars. :3478). Kapali/erisilemezse esler
      # relay (WSS) uzerinden calismaya devam eder. Firewall'da UDP 3478 acik olmali.
      - "3478:3478/udp"
    environment:
      - ZORVEN_DB_DSN=postgres://${POSTGRES_USER:-rpshell}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli (deploy/.env)}@postgres:5432/${POSTGRES_DB:-rpshell}?sslmode=disable
      # Veritabani havuzu: ust sinir ve sorgu zaman asimi (migration/retention muaf).
      - ZORVEN_DB_MAX_CONNS=${ZORVEN_DB_MAX_CONNS:-20}
      - ZORVEN_DB_STATEMENT_TIMEOUT_MS=${ZORVEN_DB_STATEMENT_TIMEOUT_MS:-15000}
      # Go cop toplayici yumusak bellek tavani (mem_limit'in altinda kalmali).
      - GOMEMLIMIT=${ZORVEN_GOMEMLIMIT:-1500MiB}
      # Kurtarilmayan panik/fatal'da TUM goroutine yiginlari loga (varsayilan yalniz
      # paniklenen goroutine); kilitlenme/yaris teshisi icin. Log boyutu x-logging ile sinirli.
      - GOTRACEBACK=${ZORVEN_GOTRACEBACK:-all}
      # Log bicimi: text (varsayilan) | json (log toplayici icin).
      - ZORVEN_LOG_FORMAT=${ZORVEN_LOG_FORMAT:-text}
      # Metrik + /readyz + (ZORVEN_PPROF=1 ise) pprof dinleyicisi. Yalniz konteyner ici
      # loopback; port yayinlanmaz. Okuma: docker compose exec zorven-primary
      #   curl -s -H "Authorization: Bearer $ZORVEN_METRICS_TOKEN" http://127.0.0.1:9102/metrics
      # Loopback disi adres verilirse ZORVEN_METRICS_TOKEN ZORUNLU (yoksa dinleyici acilmaz).
      - ZORVEN_METRICS_ADDR=${ZORVEN_METRICS_ADDR:-127.0.0.1:9102}
      - ZORVEN_METRICS_TOKEN=${ZORVEN_METRICS_TOKEN:-}
      - ZORVEN_PPROF=${ZORVEN_PPROF:-}
      - ZORVEN_PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-localhost}
      # Kopuk ajan operator alarmi (bos: yalniz WARN log); esik dakika (0 kapatir).
      - ZORVEN_OPS_ALERT_EMAIL=${ZORVEN_OPS_ALERT_EMAIL:-}
      - ZORVEN_OFFLINE_ALERT_MIN=${ZORVEN_OFFLINE_ALERT_MIN:-10}
      - ZORVEN_ADMIN_KEY=${ADMIN_KEY}
      # Better Auth cerez imzasi (web ile AYNI deger): Go imzayi dogrular, ham token Bearer reddedilir.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ZORVEN_ACME_EMAIL=${ACME_EMAIL}
      # Better Auth (kayit/giris/e-posta dogrulama) ucları web (Nitro) servisine proxy'lenir.
      - ZORVEN_AUTH_UPSTREAM=http://web:3000
      # Webmail: gelen SMTP alıcısını (:25) ve giden relay'i (mail:587) etkinleştirir.
      # Adresler org-slug@mail.<domain> biçimindedir. Boş bırakılırsa webmail kapalı.
      - ZORVEN_MAIL_DOMAIN=mail.${PLATFORM_DOMAIN:-localhost}
      # Gelen posta kimlik dogrulamasi (SPF/DKIM/DMARC + Authentication-Results):
      # bos/enforce = politika uygulanir (DMARC reject -> 550, quarantine -> Onemsiz klasoru);
      # monitor = yalniz basliga yazilir, hicbir ileti reddedilmez/ayrilmaz; off = dogrulama yok.
      - ZORVEN_MAIL_AUTH=${ZORVEN_MAIL_AUTH:-}
      # Mail istemcisi sunuculari (IMAP/SMTP gonderim; yalniz MAIL_DOMAIN + TLS sertifikasi
      # varken calisir). Sunucu adi varsayilan mail.<platform domain>; sertifika bu adi kapsamali.
      - ZORVEN_IMAP_ADDR=${ZORVEN_IMAP_ADDR:-:993}
      - ZORVEN_IMAP_DEBUG=${ZORVEN_IMAP_DEBUG:-}
      - ZORVEN_SUBMISSION_ADDR=${ZORVEN_SUBMISSION_ADDR:-:587}
      - ZORVEN_SUBMISSIONS_ADDR=${ZORVEN_SUBMISSIONS_ADDR:-:465}
      # Log saklama suresi (gun). Vars. 30; 0 = temizlik kapali.
      - ZORVEN_LOG_RETENTION_DAYS=${ZORVEN_LOG_RETENTION_DAYS:-30}
      # Secret Vault (FAZ 1 / F06) sifreleme anahtari (base64 32 bayt). Bos ise
      # secret olusturma 503 doner; policy motoru bundan bagimsiz calisir.
      - ZORVEN_SECRET_KEY=${ZORVEN_SECRET_KEY:-}
      # Zorven CAPTCHA platform sitesi (kayit formu). Ikisi de bossa platform sitesi yok.
      - ZORVEN_CAPTCHA_PLATFORM_SITEKEY=${ZORVEN_CAPTCHA_PLATFORM_SITEKEY:-}
      - ZORVEN_CAPTCHA_PLATFORM_SECRET=${ZORVEN_CAPTCHA_PLATFORM_SECRET:-}
      - ZORVEN_CAPTCHA_PLATFORM_DOMAINS=${ZORVEN_CAPTCHA_PLATFORM_DOMAINS:-}
      # Sosyal giris butonlarinin gorunurlugu icin (asil OAuth Better Auth/web'de).
      # Ziyaretci OAuth (tunel erisim denetimi) icin secret da gerekir; yoksa oauth modu fail-closed.
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Rezerve port havuzu (bos = tek havuz, tum IP'ler). Or: 203.0.113.7+0,198.51.100.7+10000
      - ZORVEN_TCP_BIND_IPS=${ZORVEN_TCP_BIND_IPS:-}
      - ZORVEN_TCP_HOSTS=${ZORVEN_TCP_HOSTS:-}
      # MTA-STS (bos = testing / varsayilan max_age). 23 Eki: enforce + 604800.
      - ZORVEN_MTA_STS_MODE=${ZORVEN_MTA_STS_MODE:-}
      - ZORVEN_MTA_STS_MAX_AGE=${ZORVEN_MTA_STS_MAX_AGE:-}
    volumes:
      # certs bir bind mount: setup öncesi buraya self-signed server.crt/server.key
      # yerleştirilir. DualCertManager bilinmeyen host'lar (ör. IP) için anında
      # dev sertifikası üretir, doğrulanmış custom domain'ler için ACME kullanır.
      - ./certs:/app/certs
      - client_bins:/app/server/bin
      # Z3 Geo: ulke veritabani (MMDB, salt-okunur). Dosya: ${ZORVEN_DATA_DIR:-./data}/
      # GeoLite2-Country.mmdb (veya ZORVEN_GEOIP_DB ile baska ad). Yoksa ulke
      # "unknown" sayilir; dosya atomik degistirilmeli (gecici dosya + mv).
      - ${ZORVEN_DATA_DIR:-./data}:/app/data:ro
    command: >
      serve
      --addr :443
      --http-addr :80
      --tls-cert /app/certs/server.crt
      --tls-key /app/certs/server.key
      --platform-domain ${PLATFORM_DOMAIN:-localhost}
      --control-host ${PLATFORM_DOMAIN:-localhost}
      --control-host www.${PLATFORM_DOMAIN:-localhost}
      --control-host panel.${PLATFORM_DOMAIN:-localhost}
      --control-host app.${PLATFORM_DOMAIN:-localhost}
      --control-host localhost
      --control-host 127.0.0.1
      --auth-upstream http://web:3000

  # Better Auth (Nitro node-server): kayit/giris/e-posta dogrulama uclari.
  # Dashboard SPA'sini Go gomulu servis eder; bu servis yalnizca /api/auth/*
  # calistirir ve tunel sunucusu tarafindan proxy'lenir (disari port ACMAZ).
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # O20: Nitro yalniz 3000'i (ayricaliksiz port) dinler, dosya sahipligi degistirmez;
    # hicbir yetenek gerekmez.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Nitro'nun 3000 portu dinlemede mi (imajda curl/wget varsayimi yok; node her zaman var).
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-rpshell}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli (deploy/.env)}@postgres:5432/${POSTGRES_DB:-rpshell}?sslmode=disable
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # Panel panel.<alan-adi>'te; auth uclari, dogrulama linkleri ve callback'ler bu host uzerinden.
      - BETTER_AUTH_URL=https://panel.${PLATFORM_DOMAIN:-localhost}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-localhost}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # E-posta: dahili Postfix (mail servisi). Lokal ag, auth gerektirmez.
      - SMTP_HOST=mail
      - SMTP_PORT=587
      - SMTP_FROM=${SMTP_FROM:-Zorven <no-reply@${PLATFORM_DOMAIN:-localhost}>}
      - SMTP_ALLOW_SELF_SIGNED=true
      # Kayit CAPTCHA (platform sitesi gizli anahtari bos ise kapali).
      - ZORVEN_CAPTCHA_PLATFORM_SECRET=${ZORVEN_CAPTCHA_PLATFORM_SECRET:-}
      # Go API tabani (siteverify). Bos = https://PLATFORM_DOMAIN.
      - ZORVEN_API_INTERNAL_URL=${ZORVEN_API_INTERNAL_URL:-}
    expose:
      - "3000"

  # Kendi sunucumuzda giden e-posta (Postfix + OpenDKIM). Harici saglayici yok.
  # DKIM_AUTOGENERATE ilk acilista anahtar uretir; DNS'e eklenecek TXT kaydini
  # loglara yazar:  docker compose logs mail | grep -A3 "DKIM"
  # Teslim edilebilirlik icin SPF/DKIM/DMARC/PTR sart.
  mail:
    image: boky/postfix:latest
    restart: unless-stopped
    logging: *default-logging
    # Saglik kontrolu imajin kendi HEALTHCHECK'i (/scripts/healthcheck.sh, 30 sn); ezilmez.
    hostname: mail.${PLATFORM_DOMAIN:-localhost}
    environment:
      # Hem <alan-adi> (auth mailleri) hem mail.<alan-adi> (webmail giden) izinli.
      # boky/postfix domainleri BOŞLUKLA ayırır (virgül tek literal domain sayılır
      # ve relay'i bozar). Bu yüzden aralarında boşluk var.
      - ALLOWED_SENDER_DOMAINS=${PLATFORM_DOMAIN:-localhost} mail.${PLATFORM_DOMAIN:-localhost}
      - DKIM_AUTOGENERATE=true
      # Duyuru e-postalari List-Unsubscribe ve List-Unsubscribe-Post
      # (RFC 8058) tasir; Gmail'in tek tik cikisi bu iki basligin DKIM imzasinda olmasini
      # ister. boky/postfix OPENDKIM_<Ayar> degiskenlerini opendkim.conf'a yazar
      # (functions.sh opendkim_custom_commands); asagidaki liste imajin varsayilan
      # SignHeaders listesi + iki liste basligidir. NOT: imajin yeni surumlerinde varsayilan
      # DKIM_BACKEND=rspamd'dir ve rspamd bu iki basligi zaten varsayilan olarak imzalar
      # (OPENDKIM_* o durumda yalniz OpenDKIM anahtarlari ilk kez rspamd'ye aktarilirken
      # sign_headers'a cevrilir; zararsizdir). OpenDKIM arka ucu ya da eski imaj icin gecerlidir.
      - OPENDKIM_SignHeaders=From,Sender,To,CC,Subject,Message-Id,Date,MIME-Version,Content-Type,Reply-To,List-Unsubscribe,List-Unsubscribe-Post
      - POSTFIX_myhostname=mail.${PLATFORM_DOMAIN:-localhost}
    volumes:
      - dkim_keys:/etc/opendkim/keys
    expose:
      - "587"

volumes:
  pgdata:
  client_bins:
  dkim_keys:
