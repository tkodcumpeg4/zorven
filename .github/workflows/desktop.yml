# Builds the desktop app for all three platforms.
#
# WHY CI IS REQUIRED: Wails does NOT support cross-compilation. Unlike plain Go,
# each platform's binary must be built on that platform — macOS Xcode/WebKit,
# Linux WebKitGTK, Windows WebView2. Hence the build matrix.
name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: zorven-desktop-windows-amd64
            ext: .exe
          - os: macos-latest
            platform: darwin/universal   # Intel + Apple Silicon in one bundle
            artifact: zorven-desktop-macos
            ext: ""
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: zorven-desktop-linux-amd64
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Linux needs WebKitGTK and gtk3; the others ship them.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # On Windows, also produce a proper NSIS .exe installer.
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Build
        working-directory: desktop
        run: wails build -platform ${{ matrix.platform }} -o zorven-desktop${{ matrix.ext }}

      # Windows installer: -nsis writes zorven-desktop-*-installer.exe under build/bin.
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: wails build -platform ${{ matrix.platform }} -nsis -o zorven-desktop${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/bin/*

      # --- Code signing (SignPath, free for OSS) -----------------------------
      # Inert until the SignPath project is configured: it runs only when the
      # repo variable SIGNPATH_ORG_ID is set. After approval, add:
      #   - repo variable  SIGNPATH_ORG_ID   (SignPath organization id)
      #   - repo secret    SIGNPATH_API_TOKEN
      # and confirm project-slug / signing-policy-slug match your SignPath setup.
      - name: Sign Windows installer (SignPath)
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: zorven
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true

  # The CLI can be cross-compiled with plain Go, so a single job suffices.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: ./scripts/build-clients.sh ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: zorven-client-all-platforms
          path: dist/*
