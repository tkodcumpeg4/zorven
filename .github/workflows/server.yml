# Sunucu modulunun testleri.
#
# Neden ayri bir Postgres servisi: pgstore testleri GERCEK bir veritabani
# ister. ZORVEN_TEST_PG_DSN ayarli olmadiginda o testler t.Skip ile atlanir;
# burada ayarli oldugu icin CI onlari gercekten kosar.
name: server

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rpshell
          POSTGRES_PASSWORD: rpshell
          # Adinda "test" GECMELI: testler tablolari TRUNCATE ediyor ve
          # pgstore_test.go gercek gorunumlu bir veritabanini reddediyor.
          POSTGRES_DB: rpshell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.work ve server/go.mod "go 1.25.0" ister; daha dusuk surum derlemez.
          go-version: "1.25"

      - name: build + vet
        working-directory: server
        run: |
          go build ./...
          go vet ./...

      - name: test (Postgres dahil)
        working-directory: server
        env:
          ZORVEN_TEST_PG_DSN: postgres://rpshell:rpshell@localhost:5432/rpshell_test
        run: go test ./...
