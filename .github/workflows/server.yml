# Server module: build, vet and unit tests.
#
# Postgres-backed integration tests self-skip when ZORVEN_TEST_PG_DSN is unset
# (they require a real database plus the Better Auth service and DNS). Run them
# locally with a Postgres instance; see the tests under server/ for details.
name: server

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.work and server/go.mod require Go 1.25.
          go-version: "1.25"

      - name: build + vet
        working-directory: server
        run: |
          go build ./...
          go vet ./...

      - name: unit tests
        working-directory: server
        run: go test ./...
